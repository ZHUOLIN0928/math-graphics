  <line x1="150" y1="90" x2="60" y2="90" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4"  stroke-linecap="round" />
  <line x1="56" y1="90" x2="60" y2="90" stroke="#000000" stroke-width="1.4"   stroke-linecap="round" />
  <text x="52" y="94" font-size="13" font-style="italic" font-weight="bold" font-family="Times New Roman, Songti SC, SimSun, serif" fill="#000000" text-anchor="end">v_m</text>
  <line x1="150" y1="240" x2="150" y2="244" stroke="#000000" stroke-width="1.4"   stroke-linecap="round" />
  <text x="150" y="258" font-size="13" font-style="italic" font-weight="bold" font-family="Times New Roman, Songti SC, SimSun, serif" fill="#000000" text-anchor="middle">t₁</text>
  <line x1="270" y1="240" x2="270" y2="244" stroke="#000000" stroke-width="1.4"   stroke-linecap="round" />
  <text x="270" y="258" font-size="13" font-style="italic" font-weight="bold" font-family="Times New Roman, Songti SC, SimSun, serif" fill="#000000" text-anchor="middle">t₂</text>
  <line x1="380" y1="240" x2="380" y2="244" stroke="#000000" stroke-width="1.4"   stroke-linecap="round" />
  <text x="380" y="258" font-size="13" font-style="italic" font-weight="bold" font-family="Times New Roman, Songti SC, SimSun, serif" fill="#000000" text-anchor="middle">t₃</text>
  <text x="210" y="160" font-size="12"  font-weight="bold" font-family="Times New Roman, Songti SC, SimSun, serif" fill="#000000" text-anchor="middle">位移 x = 梯形面积 S</text>
  <line x1="105" y1="165" x2="85" y2="125" stroke="#64748b" stroke-width="1.0"   stroke-linecap="round" />
  <line x1="85" y1="125" x2="45" y2="125" stroke="#64748b" stroke-width="1.0"   stroke-linecap="round" />
