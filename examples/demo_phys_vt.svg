<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" style="background-color: #ffffff;">

    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
      </marker>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
      </marker>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
      </marker>
    </defs>

  <polygon points="60,240 150,90 270,90 380,240" fill="rgba(0, 0, 0, 0.05)" stroke="none" stroke-width="1.5" stroke-linejoin="round" />
  <line x1="60" y1="240" x2="440" y2="240" stroke="#000000" stroke-width="1.8"  marker-end="url(#arrow)" stroke-linecap="round" />
  <text x="448" y="244" font-size="13" font-style="italic"  font-family="Times New Roman, Songti SC, SimSun, serif" fill="#000000" text-anchor="start">t / s</text>
  <line x1="60" y1="240" x2="60" y2="40" stroke="#000000" stroke-width="1.8"  marker-end="url(#arrow)" stroke-linecap="round" />
  <text x="60" y="26" font-size="13" font-style="italic"  font-family="Times New Roman, Songti SC, SimSun, serif" fill="#000000" text-anchor="middle">v / (m·s⁻¹)</text>
  <text x="50" y="256" font-size="13" font-style="italic" font-weight="bold" font-family="Times New Roman, Songti SC, SimSun, serif" fill="#000000" text-anchor="middle">O</text>
  <line x1="60" y1="240" x2="150" y2="90" stroke="#000000" stroke-width="2.2"   stroke-linecap="round" />
  <line x1="150" y1="90" x2="270" y2="90" stroke="#000000" stroke-width="2.2"   stroke-linecap="round" />
  <line x1="270" y1="90" x2="380" y2="240" stroke="#000000" stroke-width="2.2"   stroke-linecap="round" />
