  <line x1="325" y1="165" x2="345" y2="125" stroke="#64748b" stroke-width="1.0"   stroke-linecap="round" />
  <line x1="345" y1="125" x2="395" y2="125" stroke="#64748b" stroke-width="1.0"   stroke-linecap="round" />
  <text x="398" y="120" font-size="11" font-style="italic" font-weight="bold" font-family="Times New Roman, Songti SC, SimSun, serif" fill="#000000" text-anchor="start">a₂ &lt; 0 (匀减速)</text>
  <text x="210" y="78" font-size="11" font-style="italic" font-weight="bold" font-family="Times New Roman, Songti SC, SimSun, serif" fill="#000000" text-anchor="middle">a = 0 (匀速)</text>
  <text x="240" y="306" font-size="12"   font-family="Times New Roman, Songti SC, SimSun, serif" fill="#000000" text-anchor="middle">运动学 v-t 过程分析图 (斜率对应加速度，面积对应位移)</text>
</svg>